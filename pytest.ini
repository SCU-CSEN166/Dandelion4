[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: needs network, a GPU or a model download; excluded by default (run with -m slow)
addopts = -m "not slow" --cov=src.training.make_audio --cov=src.asr.transcribe --cov=evaluation.baseline_runner --cov=evaluation.eval_wer --cov-report=term-missing --cov-fail-under=90
