# Tool configuration only (this repository is not a packaged project).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "src/baseline.py",
    "src/generate_data.py",
    "evaluation/evaluate.py",
    ".venv",
    ".temp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["make_audio", "transcribe", "baseline_runner", "eval_wer"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "evaluation"]
explicit_package_bases = true
files = [
    "src/make_audio.py",
    "src/transcribe.py",
    "evaluation/baseline_runner.py",
    "evaluation/eval_wer.py",
    "tests",
]

# Third-party packages installed without a py.typed marker or stubs.
# (librosa, jiwer, edge_tts, transformers, torch and numpy all ship py.typed.)
[[tool.mypy.overrides]]
module = ["soundfile", "av", "gliner"]
ignore_missing_imports = true
