# Tool configuration only (this repository is not a packaged project).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "notebooks",
    "src/legacy",
    ".venv",
    ".temp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["demo", "evaluation", "src"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["."]
explicit_package_bases = true
files = [
    "demo",
    "src/core",
    "src/asr",
    "src/nlp",
    "src/pipeline",
    "src/training",
    "evaluation",
    "tests",
]

# Third-party packages installed without a py.typed marker or stubs.
# (librosa, jiwer, edge_tts, transformers, torch and numpy all ship py.typed.)
[[tool.mypy.overrides]]
module = ["soundfile", "av", "gliner"]
ignore_missing_imports = true
